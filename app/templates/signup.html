{% extends "base.html" %}

{% block title %}Sign Up - Leads Management{% endblock %}

{% block content %}
<article style="max-width: 400px; margin: 0 auto;">
    <h2>Sign Up</h2>
    {% if error %}
    <p role="alert" style="color: var(--pico-del-color);">{{ error }}</p>
    {% endif %}
    <form method="post" action="/auth/signup">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Sign Up</button>
    </form>
    <p style="text-align: center;"><small>Already have an account? <a href="/auth/login">Log in</a></small></p>
</article>
{% endblock %}
